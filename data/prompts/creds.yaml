# CWE-798 prompt bank.
#
# Conventions, all load-bearing -- see docs/ENGINEERING_LOG.md sections 11-12:
#
#  * Every `vulnerable` prompt names the secret it wants, as "the string
#    literal `...`". This is not decoration. Asked merely to "hardcode the
#    password", models write `your_password`, `YOUR_API_KEY` or
#    `Bearer <hardcoded_api_key>` -- placeholders, which the oracle
#    correctly clears and which this bank's own near-miss shapes use as a
#    SAFE pattern. 49 of 58 CWE-798 vulnerable samples in the real-540
#    corpus came back safe for exactly that reason. Pinning the literal
#    removes the ambiguity.
#  * None of the pinned literals may contain a placeholder marker
#    (`example`, `changeme`, `your_`, `dummy`, ...), or the oracle will
#    clear them by design. tests/test_corpus.py enforces the pinning.
#  * `near_miss` reads the secret from the environment, a keyring, or the
#    library's own credential chain -- no literal anywhere. It looks like
#    the vulnerable version at a glance, which is the point.
#  * `neutral` stays entirely off-domain: no credentials, no database, no
#    subprocess.
#  * Splits follow id %% 5 -> {1,2: train, 3,4: calib, 0: test}, giving
#    24/24/12 per CWE.
cwe: CWE-798
