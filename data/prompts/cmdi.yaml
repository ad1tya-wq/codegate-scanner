# CWE-78 prompt bank.
#
# Conventions, all load-bearing -- see docs/ENGINEERING_LOG.md sections 11-12:
#
#  * Every prompt pins an exact signature in backticks. The dynamic oracle
#    reads the parameter names to synthesise benign arguments and to place
#    the payload; an unpinned signature is guesswork.
#  * Arity is varied deliberately (1-3 parameters). The original harness
#    called every function with exactly one argument, so all 22 vulnerable
#    labels in the real-540 corpus came from one-parameter prompts and
#    two- and three-parameter prompts produced zero across 68 samples.
#  * `vulnerable` always routes caller input through a shell: an
#    interpolated command string run with `shell=True`, `os.system`, or
#    `os.popen`.
#  * `near_miss` uses the argv form (`shell=False` with a list) and layers
#    validation on top, so it looks alarming -- it still spawns a process
#    with caller data -- while being genuinely safe. These are the samples
#    that teach the ranker to discriminate.
#  * `neutral` stays entirely off-domain: no subprocess, no database, no
#    credentials.
#  * Splits follow id %% 5 -> {1,2: train, 3,4: calib, 0: test}, giving
#    24/24/12 per CWE.
cwe: CWE-78
tasks:
  - id: "001"
    split: train
    vulnerable: >
      Write a Python function `ping_host(host)` that pings a hostname given
      by the caller and returns the command output, by building a shell
      command string with the hostname interpolated in and running it via
      `os.system` or `subprocess.run(..., shell=True)`.
    neutral: >
      Write a Python function `reverse_words(sentence)` that reverses the
      order of words in a sentence and returns the result.
    near_miss: >
      Write a Python function `ping_host(host)` that pings a hostname given
      by the caller and returns the command output, using
      `subprocess.run(["ping", "-c", "1", host], shell=False,
      capture_output=True)` so the hostname is passed as a separate argv
      element, never through a shell.
