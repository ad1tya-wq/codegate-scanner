    near_miss: >
      Write a Python function `extract_archive(archive_path)` that extracts
      a zip archive using
      `subprocess.run(["unzip", "-o", archive_path], shell=False)`, first
      checking the path ends with `.zip` before the call.
  - id: "008"
    split: train
    vulnerable: >
      Write a Python function `check_disk_usage(directory)` that reports
